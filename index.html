<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14281f">
<title>20-minute class timer</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;background:#f4f3eb;color:#14281f;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center}
main{text-align:center;width:100%;padding:32px 16px}
h1{font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;margin:0 0 32px}
#time{font-size:clamp(80px,23vw,320px);font-weight:700;letter-spacing:-.065em;line-height:1.1;font-variant-numeric:tabular-nums}
#status{height:32px;margin:20px 0 40px;font-size:22px}
.controls{display:flex;gap:16px;justify-content:center}
button{font:600 20px Arial,sans-serif;border:2px solid #14281f;border-radius:12px;min-width:150px;padding:18px 30px;cursor:pointer;background:transparent;color:inherit}
#start{background:#14281f;color:#fff}button:hover{filter:brightness(.85)}button:focus-visible{outline:4px solid #2675df;outline-offset:5px}button:disabled{opacity:.35;cursor:default}
body.finished{background:#a51f2f;color:#fff}body.finished button{border-color:#fff}body.finished #start{background:#fff;color:#a51f2f}
@media(max-width:380px){button{min-width:120px;padding:16px 22px}h1{font-size:11px}}
</style>
</head>
<body>
<main aria-label="20-minute class countdown">
<h1>Class exercise · 20 minutes</h1>
<div id="time" role="timer" aria-label="20 minutes remaining">20:00</div>
<p id="status" role="status" aria-live="polite">Ready when you are</p>
<div class="controls"><button id="start" type="button">Start</button><button id="stop" type="button" disabled>Stop</button></div>
</main>
<script>
(() => {
  const duration = 20 * 60 * 1000;
  const time = document.getElementById('time');
  const status = document.getElementById('status');
  const start = document.getElementById('start');
  const stop = document.getElementById('stop');
  let remaining = duration, deadline = 0, running = false, finished = false;
  function render() {
    const seconds = Math.max(0, Math.ceil(remaining / 1000));
    const minutes = Math.floor(seconds / 60), rest = seconds % 60;
    time.textContent = String(minutes).padStart(2, '0') + ':' + String(rest).padStart(2, '0');
    time.setAttribute('aria-label', minutes + ' minutes ' + rest + ' seconds remaining');
    document.title = time.textContent + ' · Class timer';
  }
  function finish() {
    running = false; finished = true; remaining = 0;
    document.body.classList.add('finished');
    status.textContent = "Time's up";
    start.textContent = 'Start'; stop.disabled = true;
    render();
  }
  function tick() {
    if (!running) return;
    remaining = Math.max(0, deadline - Date.now());
    if (remaining === 0) finish(); else render();
  }
  start.addEventListener('click', () => {
    if (running) {
      tick();
      if (finished) return;
      running = false;
      start.textContent = 'Start';
      status.textContent = 'Paused';
    } else {
      if (finished) { remaining = duration; finished = false; document.body.classList.remove('finished'); }
      deadline = Date.now() + remaining;
      running = true; start.textContent = 'Pause';
      status.textContent = 'Exercise in progress'; stop.disabled = false;
      render();
    }
  });
  stop.addEventListener('click', finish);
  document.addEventListener('visibilitychange', tick);
  setInterval(tick, 100);
})();
</script>
</body>
</html>
